[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "whiff-python"
version = "0.1.0"
description = "Identify a file or bytes and return a whiff/1 report."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Sin Anima" }]
keywords = ["metadata", "file-format", "detection", "whiff"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.urls]
Upstream = "https://github.com/baoulo/whiff"

[tool.maturin]
manifest-path = "native/Cargo.toml"
module-name = "whiff._native"
python-source = "src"
include = [
    "src/whiff/py.typed",
    "src/whiff/schemas/whiff-1.schema.json",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
